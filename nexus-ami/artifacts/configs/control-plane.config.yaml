# Nexus Control Plane — prod-shape config for AMI / appliance form factor.
# Architecture: docs/developers/architecture/cross-cutting/deployment/ami-appliance-architecture.md
# Secrets + DATABASE_URL loaded from /etc/nexus/control-plane.env at boot.

server:
  port: 3001
  host: "127.0.0.1"            # loopback-only; nginx (same host) fronts /api, /oauth, /scim via :443
  shutdownTimeout: "10s"

database:
  url: ""                      # env DATABASE_URL
  maxConns: 25
  minConns: 5
  maxConnLifetime: "300s"

redis:
  mode: standalone
  addrs: ["127.0.0.1:6379"]
  username: ""
  password: ""                 # env REDIS_PASSWORD
  db: 0
  sentinel:
    masterName: ""
    username: ""
    password: ""
  cluster:
    maxRedirects: 8
    routeRandomly: false
    readOnly: false
  tls:
    enabled: false
    insecureSkipVerify: false
    caFile: ""
    certFile: ""
    keyFile: ""
    serverName: ""
  poolSize: 200
  minIdleConns: 50
  maxRetries: 3
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  poolTimeout: 4s

log:
  level: "info"
  format: "json"
  file: "/var/log/nexus/control-plane.log"

# Peer service URLs (ai-gateway, compliance-proxy) are NOT configured here:
# each peer reports its address to the Hub and CP resolves it at request
# time (shared/transport/peerurl).

registry:
  nexusHubUrl: "http://127.0.0.1:3060"

# Secrets are env-only (loaded from /etc/nexus/control-plane.env):
#   INTERNAL_SERVICE_TOKEN, ADMIN_KEY_HMAC_SECRET, CREDENTIAL_ENCRYPTION_KEY,
#   COMPLIANCE_PROXY_API_TOKEN — yaml carries no secret fields.
crypto:
  production: true

agent:
  caDir: "/var/lib/nexus/agentca"

otel:
  endpoint: ""
  serviceName: "nexus-control-plane"

mq:
  driver: "nats"
  nats:
    url: "nats://127.0.0.1:4222"

# OIDC issuer for tokens minted by this Control Plane. The issuer claim must
# match the URL clients reach the CP on so JWKS fetch + iss-claim validation
# work. Issuer value is per-instance — first-boot stamps AUTH_SERVER_ISSUER
# into /etc/nexus/control-plane.env using the detected public IP. The empty
# string here is a placeholder so the env override hook fires; see
# configuration-architecture.md L3 > L2.
authServer:
  issuer: ""                   # env AUTH_SERVER_ISSUER
  keystoreDir: "/var/lib/nexus/authkeys"

# Out-of-band body storage. localfs (no S3 in the appliance); same root +
# caps as the other three services — see nexus-hub.config.yaml for the why.
spill:
  enabled: true
  backend: "localfs"
  localfs:
    root: "/var/lib/nexus/spill"
    perObjectCap: 33554432     # 32 MiB — aligned with nginx global client_max_body_size (spilled bodies are AI prompts/responses, rarely larger)
    totalSizeCap: 5368709120   # 5 GiB
    retentionDays: 7
