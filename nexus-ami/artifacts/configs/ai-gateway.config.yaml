# Nexus AI Gateway — prod-shape config for AMI / appliance form factor.
# Architecture: docs/developers/architecture/cross-cutting/deployment/ami-appliance-architecture.md
# Secrets + DATABASE_URL loaded from /etc/nexus/ai-gateway.env at boot.

server:
  port: 3050
  host: "127.0.0.1"            # loopback-only; nginx fronts /v1 via :443. Critically keeps the
                               # unauthenticated /internal/* debug surface (incl. credential probe)
                               # off every interface but loopback.
  readTimeout: "30s"
  writeTimeout: "360s"

database:
  url: ""                      # env DATABASE_URL

redis:
  mode: standalone
  addrs: ["127.0.0.1:6379"]
  username: ""
  password: ""                 # env REDIS_PASSWORD
  db: 0
  sentinel:
    masterName: ""
    username: ""
    password: ""
  cluster:
    maxRedirects: 8
    routeRandomly: false
    readOnly: false
  tls:
    enabled: false
    insecureSkipVerify: false
    caFile: ""
    certFile: ""
    keyFile: ""
    serverName: ""
  poolSize: 200
  minIdleConns: 50
  maxRetries: 3
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s
  poolTimeout: 4s

# Secrets are env-only (loaded from /etc/nexus/ai-gateway.env):
#   INTERNAL_SERVICE_TOKEN, ADMIN_KEY_HMAC_SECRET, CREDENTIAL_ENCRYPTION_KEY,
#   AI_GATEWAY_API_TOKEN — yaml carries no secret fields.

log:
  level: "info"
  format: "json"
  file: "/var/log/nexus/ai-gateway.log"

registry:
  nexusHubUrl: "http://127.0.0.1:3060"

mq:
  driver: "nats"
  nats:
    url: "nats://127.0.0.1:4222"

cors:
  enabled: false
  allowedOrigins: []
  allowedMethods: ["GET", "POST", "OPTIONS"]
  # Extra request headers on top of the built-in always-allowed set
  # (gateway auth/correlation/feature headers + the forward-header
  # allowlist). Extends, never replaces.
  allowedHeaders: []
  maxAgeSec: 600

cache:
  enabled: true
  ttl: 5m
  prefix: "ai-gw:"
  broker: true

otel:
  endpoint: ""
  serviceName: "nexus-ai-gateway"

observability:
  latencyDetail: true

routing:
  defaultRetryPolicy:
    # 2 = one same-target retry on a transient fault before L3 failover.
    maxAttemptsPerTarget: 2
    retryOn: ["network", "timeout", "429", "5xx"]
    backoffInitial: 250ms
    backoffMax: 5s
    backoffJitter: 0.2

# Out-of-band body storage. localfs (no S3 in the appliance); same root +
# caps as the other three services — see nexus-hub.config.yaml for the why.
spill:
  enabled: true
  backend: "localfs"
  localfs:
    root: "/var/lib/nexus/spill"
    perObjectCap: 33554432     # 32 MiB — aligned with nginx global client_max_body_size (spilled bodies are AI prompts/responses, rarely larger)
    totalSizeCap: 5368709120   # 5 GiB
    retentionDays: 7
