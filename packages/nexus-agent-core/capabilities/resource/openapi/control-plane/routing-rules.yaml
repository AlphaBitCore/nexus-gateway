                                                attempts away; a value above the derived ceiling buys nothing, because
                                                no target has one left to give. To grant a target more attempts, raise
                                                maxAttemptsPerTarget. When non-zero, must be in [1,20].
                                        maxWalkDuration:
                                            type: string
                                            description: >-
                                                Wall-clock time one request may spend being walked across targets, as a
                                                Go duration string ("10m", "45s"). Bounds patience where
                                                maxUpstreamCalls bounds spend; the two fail in different directions, so
                                                an unresponsive upstream exhausts this one and an expensive one
                                                exhausts the other. Checked before each dispatch, never during one, so
                                                a walk admitted just inside the deadline can exceed it by one attempt.
                                                Omit to inherit the gateway default. When set, must be between 1s and
                                                1h — a BARE NUMBER is read as NANOSECONDS, so 600 expires the walk
                                                before its first dispatch and turns every request on the rule into a
