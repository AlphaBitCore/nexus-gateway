paths:
    /api/admin/routing-rules:
        get:
            operationId: listRoutingRules
            summary: List routing rules
            description: |-
                Returns routing rules ordered by pipeline stage ascending then priority
                descending. Supports filtering by free-text query (matches name or
                description, case-insensitive), strategy type, and enabled state, plus
                standard limit/offset pagination. The response wraps the rule array in a
                `data` field alongside the unfiltered-by-pagination `total` count.
            x-nexus-iam-action: iam.ResourceRoutingRule.Action(iam.VerbRead)
            x-nexus-tier: auto
            parameters:
                - name: q
                  in: query
                  description: Free-text search matched case-insensitively against the rule name and description.
                  required: false
                  schema:
                    type: string
                - name: strategyType
                  in: query
                  description: Filter to rules with this exact strategy type.
                  required: false
                  schema:
                    type: string
                - name: enabled
                  in: query
                  description: Filter by enabled state. Only the literal strings "true" and "false" are honored; any other value (or omission) applies no enabled filter.
                  required: false
                  schema:
                    type: string
            responses:
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                            example:
                                data:
                                    - id: 3f8c2a1e-7b4d-4e9a-9c1f-2d6e5a8b0c4d
                                      name: Auto smart routing
                                      description: Route auto requests through the smart strategy
                                      strategyType: smart
                                      config:
                                        candidates:
                                            - claude-sonnet-4-6
                                      matchConditions:
                                        requestedModelLiterals:
                                            - auto
                                      priority: 100
                                      pipelineStage: 1
                                      fallbackChain: []
                                      enabled: true
                                      createdAt: 2026-01-15T10:30:00Z
                                      updatedAt: 2026-01-15T10:30:00Z
                                total: 1
        post:
            operationId: createRoutingRule
            summary: Create a routing rule
            description: |-
                Creates a routing rule. Only `name`, `strategyType`, and `config` are
                required; the handler rejects a missing or empty value for any of these
                with 400. `strategyType` must be one of the recognized routing
                strategies (`single`, `fallback`, `loadbalance`, `conditional`,
                `ab_split`, `smart`, `latency`); any other value is rejected with 400.
                `policy` was accepted while it had no implementation and is now
                rejected — a rule carrying it was persisted, broadcast, and then
                resolved to nothing on every gateway.
                `config` must parse as a strategy object — a non-object JSON document
                (array, string, number) or an object whose embedded `type` is not a
                recognized strategy node type is rejected with 400 before the rule is
                persisted and broadcast fleet-wide. When `strategyType` is `smart`,
                `matchConditions` must pin `requestedModelLiterals` to `["auto"]` — an
                unrestricted smart rule is rejected with 400. The legacy
                `matchConditions.organizations` key is rejected with 422 in favor of
                `projects`. A supplied `retryPolicy` is validated for bounds before
                persistence; omitting it makes the rule inherit the AI Gateway YAML
                default. `enabled` defaults to true. `pipelineStage` defaults to 1
                when omitted and only 1 is accepted — stage 0 (policy narrowing) is
                removed, and an explicit 0 returns 400 `pipeline_stage_invalid`.
            x-nexus-iam-action: iam.ResourceRoutingRule.Action(iam.VerbCreate)
            x-nexus-tier: confirm
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    description: Human-readable rule name. Required and must be non-empty.
                                description:
                                    type:
                                        - string
                                        - "null"
                                    description: Optional free-text description of the rule.
                                strategyType:
                                    type: string
                                    description: Routing strategy identifier. Required and must be one of the recognized strategies; an unknown value is rejected with 400. The value `smart` triggers additional matchConditions validation.
                                    enum:
                                        - single
                                        - fallback
                                        - loadbalance
                                        - conditional
                                        - ab_split
                                        - latency
                                        - smart
                                config:
                                    description: >-
                                        Strategy-specific configuration. Required. Validated
                                        RECURSIVELY against the gateway's strategy-node shape: a
                                        non-object document, a field with the wrong JSON type at ANY
                                        depth (including weighted/conditional/ab/latency
                                        sub-targets, e.g. a weighted target with weight "5" as a
                                        string), an unrecognized node `type` at any depth, or a tree
                                        deeper than the gateway evaluates (10) is rejected with 400
                                        — a config that passed a shallower check used to fail the
                                        resolver's parse on every request routed by the rule.
                                matchConditions:
                                    description: 'Request-matching predicate as an arbitrary JSON value. The legacy key `organizations` is rejected (use `projects`). For `strategyType=smart`, must include `requestedModelLiterals: ["auto"]`.'
                                priority:
                                    type: integer
                                    description: Match priority within a pipeline stage; higher values are evaluated first.
                                pipelineStage:
                                    type:
                                        - integer
                                        - "null"
                                    enum: [1, null]
                                    description: >-
                                        Pipeline stage the rule belongs to. Only 1 (route) is
                                        accepted; omitted or null defaults to 1. Any other value
                                        is rejected with 400 `pipeline_stage_invalid` rather than
                                        coerced, so a caller never gets a rule they did not ask
                                        for. Stage 0 (policy narrowing) has been removed — model
                                        access is governed by the virtual key's allowed-models
                                        list, which is an allow list with no deny counterpart.
                                fallbackChain:
                                    description: >-
                                        Ordered inline recovery-target list as an array of
                                        {providerId, modelId} objects; an empty array means no inline
                                        fallback. Other shapes (e.g. bare model strings) are rejected
                                        with 400 fallback_chain_invalid — the gateway resolver decodes
                                        this list best-effort, so an unparseable chain would silently
                                        lose all failover coverage.
                                    type: array
                                    items:
                                        type: object
                                        properties:
                                            providerId:
                                                type: string
                                            modelId:
                                                type: string
                                        required:
                                            - providerId
                                            - modelId
                                retryPolicy:
                                    type:
                                        - object
                                        - "null"
                                    description: Per-rule retry override. Omit or null to inherit the AI Gateway YAML default.
                                    properties:
                                        maxAttemptsPerTarget:
                                            type: integer
                                            minimum: 1
                                            maximum: 5
                                            description: >-
                                                Dispatches one target may take on this REQUEST, clamped to [1,5]. It
                                                covers both ways a target is tried again — retried in place within a
                                                turn, and returned to later after other targets have been tried — so
                                                a target that spends it inside its first turn is not selected again.
                                                This is the cap an admin writing the number is capping;
                                                maxUpstreamCalls cannot lift it.
                                        maxUpstreamCalls:
                                            type: integer
                                            minimum: 1
                                            maximum: 20
                                            description: >-
                                                Total upstream calls one request may make, counting every dispatch
                                                across every target and rule, including the same-target attempts
                                                maxAttemptsPerTarget governs. Omit to inherit the reach the target list
                                                already has (targets x maxAttemptsPerTarget), which is also the most
                                                the walk can spend at ANY setting: each target's allowance is its own,
                                                and no other target can spend what it leaves behind. A value takes
                                                attempts away; a value above the derived ceiling buys nothing, because
                                                no target has one left to give. To grant a target more attempts, raise
                                                maxAttemptsPerTarget. When non-zero, must be in [1,20].
                                        maxWalkDuration:
                                            type: string
                                            description: >-
                                                Wall-clock time one request may spend being walked across targets, as a
                                                Go duration string ("10m", "45s"). Bounds patience where
                                                maxUpstreamCalls bounds spend; the two fail in different directions, so
                                                an unresponsive upstream exhausts this one and an expensive one
                                                exhausts the other. Checked before each dispatch, never during one, so
                                                a walk admitted just inside the deadline can exceed it by one attempt.
                                                Omit to inherit the gateway default. When set, must be between 1s and
                                                1h — a BARE NUMBER is read as NANOSECONDS, so 600 expires the walk
                                                before its first dispatch and turns every request on the rule into a
                                                502 with every target skipped; write "10m".
                                            example: 10m
                                        backoffInitial:
                                            type: string
                                            description: >-
                                                Wait before the first same-target retry, as a Go duration string
                                                ("250ms"). Doubles per attempt up to backoffMax. Omit to inherit the
                                                gateway default. When set, must be between 1ms and 1m — a BARE NUMBER is
                                                read as NANOSECONDS, so 250 is not a pause at all and a rule written to
                                                slow its retries down speeds them up.
                                            example: 250ms
                                        backoffMax:
                                            type: string
                                            description: >-
                                                Ceiling the doubling backoff clamps at, as a Go duration string ("5s").
                                                Omit to inherit the gateway default. When set, must be between 1ms and 1m
                                                — a BARE NUMBER is read as NANOSECONDS, and this value is the ceiling the
                                                walk actually uses, so 5 clamps every wait to nothing whatever
                                                backoffInitial says.
                                            example: 5s
                                        backoffJitter:
                                            type: number
                                            description: >-
                                                Fraction of the computed wait applied as uniform +/- jitter, so retries
                                                from many concurrent requests do not land together. 0.2 means +/-20%.
                                                Must be between 0 and 1: above 1 the swing exceeds the wait it jitters,
                                                so a pause is as likely to be nothing as to be the configured value. Omit
                                                to inherit the gateway default.
                                            example: 0.2
                                        retryOn:
                                            type: array
                                            description: Error classes that trigger a retry.
                                            items:
                                                type: string
                                                enum:
                                                    - network
                                                    - timeout
                                                    - "429"
                                                    - 5xx
                                enabled:
                                    type:
                                        - boolean
                                        - "null"
                                    description: Whether the rule is active. Defaults to true when omitted or null.
                            required:
                                - name
                                - strategyType
                                - config
                        example:
                            name: Auto smart routing
                            description: Route auto requests through the smart strategy
                            strategyType: smart
                            config:
                                candidates:
                                    - claude-sonnet-4-6
                            matchConditions:
                                requestedModelLiterals:
                                    - auto
                            priority: 100
                            fallbackChain: []
                            enabled: true
            responses:
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                "422":
                    description: Unprocessable Entity
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                "500":
