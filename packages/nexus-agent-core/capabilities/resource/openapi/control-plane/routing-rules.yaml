    /api/admin/routing-rules/simulate:
        post:
            operationId: routingSimulate
            summary: Simulate routing for a request
            description: |-
                Forwards the request body verbatim to the AI Gateway internal
                routing-simulate endpoint and streams the gateway response back. The body
                is an opaque JSON object passed through unchanged; the success status code
                and shape are whatever the AI Gateway returns. The Control Plane returns
                400 when the body is not valid JSON, 500 when it cannot re-encode the
                payload, and 502 when the AI Gateway is unreachable.
            x-nexus-iam-action: iam.ResourceRoutingRule.Action(iam.VerbSimulate)
            x-nexus-tier: confirm
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: Opaque simulation request forwarded verbatim to the AI Gateway routing-simulate endpoint.
                            additionalProperties: {}
            responses:
                "400":
                    description: Bad Request — request body is not valid JSON.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                "500":
                    description: Internal Server Error — failed to encode the forwarded payload.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
                "502":
                    description: Bad Gateway — the AI Gateway is unreachable or the upstream request could not be built.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: {}
components:
    schemas:
        routingstore_RoutingRule:
            type: object
            description: A persisted routing rule row.
            properties:
                id:
                    type: string
                    description: Rule ID (UUID).
                name:
                    type: string
                    description: Human-readable rule name.
                description:
                    type:
                        - string
                        - "null"
                    description: Optional free-text description.
                strategyType:
                    type: string
                    description: Routing strategy identifier.
                config:
                    description: Strategy-specific configuration (arbitrary JSON value).
                matchConditions:
                    description: Request-matching predicate (arbitrary JSON value).
                priority:
                    type: integer
                    description: Match priority within a pipeline stage; higher is evaluated first.
                pipelineStage:
                    type: integer
                    description: Pipeline stage the rule belongs to.
                fallbackChain:
                    description: >-
                        Ordered inline recovery-target list as an array of
                        {providerId, modelId} objects (empty = no inline fallback).
                    type: array
                    items:
                        type: object
                        properties:
                            providerId:
                                type: string
                            modelId:
                                type: string
                        required:
                            - providerId
                            - modelId
                retryPolicy:
                    type:
                        - object
                        - "null"
                    description: Per-rule retry override. Omitted from the response when unset (the rule inherits the AI Gateway YAML default).
                    properties:
                        maxAttemptsPerTarget:
                            type: integer
                            minimum: 1
                            maximum: 5
                            description: >-
                                Dispatches one target may take on this REQUEST, clamped to [1,5]. It
                                covers both ways a target is tried again — retried in place within a
                                turn, and returned to later after other targets have been tried — so
                                a target that spends it inside its first turn is not selected again.
                                This is the cap an admin writing the number is capping;
                                maxUpstreamCalls cannot lift it.
                        maxUpstreamCalls:
                            type: integer
                            minimum: 1
                            maximum: 20
                            description: >-
                                Total upstream calls one request may make, counting every dispatch
                                across every target and rule, including the same-target attempts
                                maxAttemptsPerTarget governs. Omit to inherit the reach the target list
                                already has (targets x maxAttemptsPerTarget), which is also the most
                                the walk can spend at ANY setting: each target's allowance is its own,
                                and no other target can spend what it leaves behind. A value takes
                                attempts away; a value above the derived ceiling buys nothing, because
                                no target has one left to give. To grant a target more attempts, raise
                                maxAttemptsPerTarget. When non-zero, must be in [1,20].
                        maxWalkDuration:
                            type: string
                            description: >-
                                Wall-clock time one request may spend being walked across targets, as a
                                Go duration string ("10m", "45s"). Bounds patience where
                                maxUpstreamCalls bounds spend; the two fail in different directions, so
                                an unresponsive upstream exhausts this one and an expensive one
                                exhausts the other. Checked before each dispatch, never during one, so
                                a walk admitted just inside the deadline can exceed it by one attempt.
                                Omit to inherit the gateway default. When set, must be between 1s and
                                1h — a BARE NUMBER is read as NANOSECONDS, so 600 expires the walk
                                before its first dispatch and turns every request on the rule into a
                                502 with every target skipped; write "10m".
                            example: 10m
                        backoffInitial:
                            type: string
                            description: >-
                                Wait before the first same-target retry, as a Go duration string
                                ("250ms"). Doubles per attempt up to backoffMax. Omit to inherit the
                                gateway default. When set, must be between 1ms and 1m — a BARE NUMBER is
                                read as NANOSECONDS, so 250 is not a pause at all and a rule written to
                                slow its retries down speeds them up.
                            example: 250ms
                        backoffMax:
                            type: string
                            description: >-
                                Ceiling the doubling backoff clamps at, as a Go duration string ("5s").
                                Omit to inherit the gateway default. When set, must be between 1ms and 1m
                                — a BARE NUMBER is read as NANOSECONDS, and this value is the ceiling the
                                walk actually uses, so 5 clamps every wait to nothing whatever
                                backoffInitial says.
                            example: 5s
                        backoffJitter:
                            type: number
                            description: >-
                                Fraction of the computed wait applied as uniform +/- jitter, so retries
                                from many concurrent requests do not land together. 0.2 means +/-20%.
                                Must be between 0 and 1: above 1 the swing exceeds the wait it jitters,
                                so a pause is as likely to be nothing as to be the configured value. Omit
                                to inherit the gateway default.
                            example: 0.2
                        retryOn:
                            type: array
                            description: Error classes that trigger a retry.
                            items:
                                type: string
                                enum:
                                    - network
                                    - timeout
                                    - "429"
                                    - 5xx
                enabled:
                    type: boolean
                    description: Whether the rule is active.
                createdAt:
                    type: string
                    format: date-time
                    description: Creation timestamp.
                updatedAt:
                    type: string
                    format: date-time
                    description: Last-update timestamp.
            required:
                - id
                - name
                - strategyType
                - config
                - matchConditions
                - priority
                - pipelineStage
                - fallbackChain
                - enabled
                - createdAt
                - updatedAt
