# Nexus Gateway — nginx reverse proxy for the container form factor.
#
# Routing mirrors nexus-ami/artifacts/configs/nginx-nexus.conf so the compose
# deployment and the appliance expose the same surface. Two deliberate
# differences: this listens on plain HTTP (TLS terminates in front of the
# quickstart, not inside it), and it proxies to Compose service names rather
# than 127.0.0.1.
#
# Architecture: docs/developers/architecture/cross-cutting/deployment/container-image-architecture.md

server {
    listen      8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # Vite SPA fallback — every unmatched path serves index.html so the
    # client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin API + auth-server endpoints (both live in the control-plane binary).
    # proxy_buffering off so admin SSE surfaces stream instead of arriving as
    # one late chunk.
    location /api/ {
        proxy_pass         http://control-plane:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    # SCIM 2.0 provisioning. Without this block the SPA try_files fallback
    # returns index.html to the IdP and SCIM discovery fails.
    location /scim/ {
        proxy_pass         http://control-plane:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # AI Gateway ingress. One regex block covers every ingress wire format:
    #   /v1/...                     OpenAI canonical
    #   /v1beta/models/{model}:...  Gemini native
    #   /openai/deployments/...     Azure OpenAI native
    #   /api/paas/v4/...            GLM / Zhipu native
    # Regex so /api/paas wins over the plain /api/ prefix above (nginx matches
    # regex locations before plain-prefix locations). The gateway's /internal/*
    # endpoints and /metrics are deliberately NOT matched.
    location ~ ^/(v1|v1beta|openai/deployments|api/paas)(/|$) {
        proxy_pass         http://ai-gateway:3050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Nexus Hub — remote agent connectivity only.
    location /ws {
        proxy_pass         http://nexus-hub:3060;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/internal/things/ {
        proxy_pass         http://nexus-hub:3060;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/internal/spill/blob/ {
        proxy_pass              http://nexus-hub:3060;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # Everything else under /api/internal/ is the Control Plane's
    # service-to-service surface, reached directly by co-located services and
    # never through this proxy. Refuse at the edge as defense-in-depth on top
    # of the control-plane token gate.
    location /api/internal/ {
        return 403;
    }

    location /.well-known/ {
        proxy_pass       http://control-plane:3001;
        proxy_set_header Host $host;
    }

    # OAuth/OIDC endpoints live in the control-plane binary. Without this block
    # /oauth/authorize falls through to the SPA fallback, the SPA cannot process
    # the PKCE parameters, and login enters an infinite redirect loop.
    location /oauth/ {
        proxy_pass         http://control-plane:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Auth-server pre-bearer endpoints the login page calls to list IDPs and
    # post credentials. Without the proxy they return index.html and the SPA
    # reports "Unable to load sign-in methods".
    location /authserver/ {
        proxy_pass         http://control-plane:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health endpoints are served at the ROOT by the control-plane, not under
    # /api, so proxy_pass omits a URI and forwards the path verbatim.
    location = /healthz {
        proxy_pass       http://control-plane:3001;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass       http://control-plane:3001;
        proxy_set_header Host $host;
    }
}
