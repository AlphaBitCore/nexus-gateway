# Nexus Gateway — nginx reverse proxy for the container form factor.
#
# Routing mirrors nexus-ami/artifacts/configs/nginx-nexus.conf so the compose
# deployment and the appliance expose the same surface. Two deliberate
# differences: this listens on plain HTTP (TLS terminates in front of the
# quickstart, not inside it), and it proxies to Compose service names rather
# than 127.0.0.1.
#
# 上游主机名用 ${NEXUS_CP_UPSTREAM} / ${NEXUS_GW_UPSTREAM} / ${NEXUS_HUB_UPSTREAM} 占位,
# 由 nginx 官方 envsubst 入口(/etc/nginx/templates/*.template)在启动时按环境变量渲染:
#   * compose / 设备镜像:Dockerfile 里 ENV 默认值 = compose 服务名(control-plane /
#     ai-gateway / nexus-hub),Docker DNS 解析,行为与旧版一致;
#   * Prime ECS:task-def 覆盖为 CloudMap Service Discovery 的 FQDN(<svc>.prime.local),
#     经 VPC DNS 解析(ECS 的 SD 为各任务 ENI 写 A 记录)。
# 注:envsubst 只替换"已定义"的环境变量,故 nginx 自身的 $host/$scheme/$remote_addr 等
#   不会被动到(无同名 env)。Dockerfile 必须把本文件放到 /etc/nginx/templates/*.template
#   并设三个 ENV 默认值,否则占位符会被替换成空串导致 upstream 非法。
#
# Architecture: docs/developers/architecture/cross-cutting/deployment/container-image-architecture.md

# 转发协议:本 UI 监听明文 8080(TLS 在更上层 ALB/入口终止),故 $scheme 恒为 http。
# 若直接用 X-Forwarded-Proto $scheme 会把入口传来的 https 覆盖成 http,导致 control-plane
# 按 http 拼 OAuth 回跳地址(redirect_uri 变 http)。这里改为:优先透传入口的 X-Forwarded-Proto,
# 缺失时(如直连/compose)才回退 $scheme。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen      8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # 动态 DNS 解析:后端(control-plane/ai-gateway/nexus-hub)在 Prime ECS 上用 CloudMap
    # Service Discovery(A 记录、IP 会变)。用「resolver + 变量式 proxy_pass」让 nginx 按 TTL
    # 每次重新解析,后端重启换 IP 时本 UI 无需重启(根治静态上游缓存旧 IP 的 502)。
    # resolver 与上游主机名都由 envsubst 从环境变量渲染,兼顾 compose 与 Prime ECS:
    #   * compose:${NEXUS_RESOLVER}=127.0.0.11(Docker 内嵌 DNS),上游=compose 短名;
    #   * Prime ECS:task-def 覆盖 ${NEXUS_RESOLVER}=169.254.169.253(AmazonProvidedDNS),
    #     上游=<svc>.prime.local(CloudMap Service Discovery A 记录)。
    # 变量式 proxy_pass 每次按 valid TTL 重新解析,后端换 IP 无需重启本 UI。
    resolver ${NEXUS_RESOLVER} valid=10s ipv6=off;
    set $cp  ${NEXUS_CP_UPSTREAM};
    set $gw  ${NEXUS_GW_UPSTREAM};
    set $hub ${NEXUS_HUB_UPSTREAM};

    # Vite SPA fallback — every unmatched path serves index.html so the
    # client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin API + auth-server endpoints (both live in the control-plane binary).
    # proxy_buffering off so admin SSE surfaces stream instead of arriving as
    # one late chunk.
    location /api/ {
        proxy_pass         http://$cp:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_buffering    off;
        proxy_read_timeout 1860s;
        proxy_send_timeout 1860s;
    }

    # SCIM 2.0 provisioning. Without this block the SPA try_files fallback
    # returns index.html to the IdP and SCIM discovery fails.
    location /scim/ {
        proxy_pass         http://$cp:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
    }

    # AI Gateway ingress. One regex block covers every ingress wire format:
    #   /v1/...                     OpenAI canonical
    #   /v1beta/models/{model}:...  Gemini native
    #   /openai/deployments/...     Azure OpenAI native
    #   /api/paas/v4/...            GLM / Zhipu native
    # Regex so /api/paas wins over the plain /api/ prefix above (nginx matches
    # regex locations before plain-prefix locations). The gateway's /internal/*
    # endpoints and /metrics are deliberately NOT matched.
    location ~ ^/(v1|v1beta|openai/deployments|api/paas)(/|$) {
        proxy_pass         http://$gw:3050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_buffering    off;
        proxy_read_timeout 1860s;
        proxy_send_timeout 1860s;
    }

    # Nexus Hub — remote agent connectivity only.
    location /ws {
        proxy_pass         http://$hub:3060;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/internal/things/ {
        proxy_pass         http://$hub:3060;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/internal/spill/blob/ {
        proxy_pass              http://$hub:3060;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $fwd_proto;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # Everything else under /api/internal/ is the Control Plane's
    # service-to-service surface, reached directly by co-located services and
    # never through this proxy. Refuse at the edge as defense-in-depth on top
    # of the control-plane token gate.
    location /api/internal/ {
        return 403;
    }

    location /.well-known/ {
        proxy_pass       http://$cp:3001;
        proxy_set_header Host $host;
    }

    # OAuth/OIDC endpoints live in the control-plane binary. Without this block
    # /oauth/authorize falls through to the SPA fallback, the SPA cannot process
    # the PKCE parameters, and login enters an infinite redirect loop.
    location /oauth/ {
        proxy_pass         http://$cp:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
    }

    # Auth-server pre-bearer endpoints the login page calls to list IDPs and
    # post credentials. Without the proxy they return index.html and the SPA
    # reports "Unable to load sign-in methods".
    location /authserver/ {
        proxy_pass         http://$cp:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
    }

    # Health endpoints are served at the ROOT by the control-plane, not under
    # /api, so proxy_pass omits a URI and forwards the path verbatim.
    location = /healthz {
        proxy_pass       http://$cp:3001;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass       http://$cp:3001;
        proxy_set_header Host $host;
    }
}
